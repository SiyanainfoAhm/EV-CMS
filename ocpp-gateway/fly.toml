# Fly.io — OCPP gateway (always-on, Mumbai, 512 MB)
# Deploy: cd ocpp-gateway && fly deploy
# Docs: FLY_DEPLOY.md

app = 'ev-cms-ocpp-dfccil'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  OCPP_WS_PATH = '/ocpp'
  OCPP_CALL_TIMEOUT_MS = '30000'
  OCPP_HEARTBEAT_INTERVAL_SEC = '300'

[http_service]
  internal_port = 4040
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 150
    soft_limit = 100

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
